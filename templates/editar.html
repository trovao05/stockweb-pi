<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Produto</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header>
        <h1>StockWeb</h1>
        <p>Editar Produto</p>
    </header>

    <main>

        <h2>Editar Produto</h2>

        <form method="POST">

            <label for="nome">Nome do produto</label>
            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ produto['nome'] }}"
                required
            >

            <label for="categoria">Categoria</label>
            <input
                type="text"
                id="categoria"
                name="categoria"
                value="{{ produto['categoria'] }}"
                required
            >

            <label for="quantidade">Quantidade</label>
            <input
                type="number"
                id="quantidade"
                name="quantidade"
                value="{{ produto['quantidade'] }}"
                min="0"
                required
            >
            <label for="estoque_minimo">Estoque mínimo</label>

<input
    type="number"
    id="estoque_minimo"
    name="estoque_minimo"
    value="{{ produto['estoque_minimo'] }}"
    min="0"
    required
>

            <label for="preco">Preço</label>
            <input
                type="number"
                id="preco"
                name="preco"
                value="{{ produto['preco'] }}"
                step="0.01"
                min="0"
                required
            >

            <button type="submit">
                Salvar Alterações
            </button>

        </form>

        <br>

        <a href="/">Voltar</a>

    </main>

</body>

</html>
